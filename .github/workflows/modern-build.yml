name: Modern Sandbox Build

on:
  push:
    branches: [modern-evolution]
  pull_request:
    branches: [modern-evolution]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modern-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out UO Offline
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201

      - name: Validate installers
        shell: pwsh
        run: |
          $engine = Get-Content -Raw ./install.ps1
          [void][ScriptBlock]::Create($engine)
          [void][ScriptBlock]::Create((Get-Content -Raw ./install-gui.ps1))

          $required = @(
            "BuildModernUO",
            "FixFeluccaSeason",
            "FindOrDownloadUOData",
            "SwapT2AMap",
            "FetchSpawnMap",
            "InstallClassicUO",
            "InstallTazUO",
            "InstallUORespawn",
            "InstallRuntimeScripts"
          )

          foreach ($name in $required) {
            $pattern = "(?m)^function\s+$([regex]::Escape($name))\b"
            if ($engine -notmatch $pattern) {
              throw "install.ps1 is missing required function: $name"
            }
          }

      - name: Validate Linux installer
        run: bash -n install.sh

      - name: Check out pinned ModernUO
        run: |
          git clone https://github.com/modernuo/ModernUO.git ModernUO
          git -C ModernUO checkout --detach 114dbba6e25f0e97e8537e54025d7bfa87c03a39

      - name: Apply UO Offline engine patches
        run: |
          set -e
          for patch in patches/*.patch; do
            [ -e "$patch" ] || continue
            if [ "$(basename "$patch")" = "0005-spellhelper-t2a-dungeon-travel.patch" ]; then
              echo "$(basename "$patch"): legacy T2A only; skipped"
              continue
            fi
            if git -C ModernUO apply --reverse --check "../$patch" >/dev/null 2>&1; then
              echo "$(basename "$patch"): already present"
            elif git -C ModernUO apply --check "../$patch" >/dev/null 2>&1; then
              git -C ModernUO apply "../$patch"
              echo "$(basename "$patch"): applied"
            else
              echo "::error file=$patch::Patch does not apply to the modern pin"
              exit 1
            fi
          done

      - name: Install PlayerBots source
        run: |
          mkdir -p ModernUO/Projects/UOContent/CustomBots
          cp -R playerbots/source/CustomBots/. ModernUO/Projects/UOContent/CustomBots/

      - name: Install pinned UORespawn source and six-facet pack
        run: |
          set -euo pipefail
          UOR_COMMIT=26ad18a910dbc1318079035a87084d191ff173f9
          UOR_BASE="https://raw.githubusercontent.com/Kita72/UORespawnProject/$UOR_COMMIT/UORespawnApp/Data"

          curl -fsSL "$UOR_BASE/SERVER/MUO/UORespawnServer.zip" -o /tmp/uorespawn-server.zip
          rm -rf /tmp/uorespawn-server
          mkdir -p /tmp/uorespawn-server
          unzip -q /tmp/uorespawn-server.zip -d /tmp/uorespawn-server

          CORE="$(find /tmp/uorespawn-server -type f -name UOR_Core.cs | head -n1)"
          test -n "$CORE"
          ROOT="$(dirname "$CORE")"

          mkdir -p ModernUO/Projects/UOContent/Custom/UORespawnServer
          cp -R "$ROOT"/. ModernUO/Projects/UOContent/Custom/UORespawnServer/

          CORE_TARGET=ModernUO/Projects/UOContent/Custom/UORespawnServer/UOR_Core.cs
          sed -i 's/if (m is PlayerMobile pm && !_RespawnerList.ContainsKey(pm.Serial))/if (m is PlayerMobile pm \&\& m is not Server.CustomBots.PlayerBot \&\& !_RespawnerList.ContainsKey(pm.Serial))/' "$CORE_TARGET"
          sed -i 's/if (m is PlayerMobile pm && _RespawnerList.ContainsKey(pm.Serial))/if (m is PlayerMobile pm \&\& m is not Server.CustomBots.PlayerBot \&\& _RespawnerList.ContainsKey(pm.Serial))/' "$CORE_TARGET"
          grep -q 'm is not Server.CustomBots.PlayerBot' "$CORE_TARGET"

          SEARCH_TARGET=ModernUO/Projects/UOContent/Custom/UORespawnServer/Timers/SearchTimer.cs
          sed -i 's/if (UOR_Core.IsPaused) return;/if (UOR_Core.IsPaused || Server.CustomBots.NewbiePlayability.IsInNewbieDungeon(_Player)) return;/' "$SEARCH_TARGET"
          grep -q 'NewbiePlayability.IsInNewbieDungeon' "$SEARCH_TARGET"

          curl -fsSL "$UOR_BASE/PACKS/Approved/DefaultPack.zip" -o /tmp/uorespawn-pack.zip
          rm -rf /tmp/uorespawn-pack
          mkdir -p /tmp/uorespawn-pack
          unzip -q /tmp/uorespawn-pack.zip -d /tmp/uorespawn-pack
          REGION="$(find /tmp/uorespawn-pack -type f -name UOR_RegionSpawn.bin | head -n1)"
          test -n "$REGION"
          PACK_ROOT="$(dirname "$REGION")"

          mkdir -p ModernUO/Distribution/Data/UORespawn/INPUT
          find "$PACK_ROOT" -maxdepth 1 -type f \( -name 'UOR_*.bin' -o -name 'UOR_SpawnSettings.csv' \) -exec cp -f {} ModernUO/Distribution/Data/UORespawn/INPUT/ \;

      - name: Build UOContent
        working-directory: ModernUO
        run: dotnet build Projects/UOContent/UOContent.csproj -c Release
